<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小星星獎勵樂園</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><text y=%2226%22 font-size=%2226%22>⭐</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
<style>
:root{box-sizing:border-box;--bg:#f4f8fd;--card:#fff;--tx:#172c47;--mut:#647e9d;--ac:#3275f5;--ac2:#19b3a5;--bd:#d7e5f5;--bad:#ef475b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:18px;min-height:100vh;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.wrap{max-width:920px;margin:0 auto;padding:14px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{font-size:22px;font-weight:800}
.hero{background:linear-gradient(135deg,#448cf6,#2059db);color:#fff;border-radius:28px;padding:22px 16px;text-align:center;box-shadow:0 10px 24px rgba(47,116,246,.22);margin-bottom:16px}
.hero-num{font-size:72px;font-weight:900;line-height:1.1;margin:6px 0}
.sync-chip{display:inline-block;padding:5px 14px;border-radius:20px;font-size:14px;font-weight:700;background:rgba(255,255,255,.22);cursor:pointer}
.sync-chip.ok{background:#26c485}.sync-chip.err{background:#ef475b}.sync-chip.busy{background:#e0a800}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ic{font-size:46px;line-height:1.2}
.item-card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:16px;text-align:center;display:flex;flex-direction:column;justify-content:space-between}
.item-card b{font-size:20px;margin:6px 0;display:block}
button{font:inherit;border:0;border-radius:14px;padding:12px 18px;background:var(--ac);color:#fff;font-weight:700;cursor:pointer}
button:active{transform:scale(.97)}
button.g{background:var(--ac2)}button.l{background:transparent;color:var(--mut);border:2px solid var(--bd)}button.r{background:var(--bad)}
input{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);max-width:100%}
.bar{height:14px;border-radius:8px;background:var(--bd);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#18c29c,#26c485)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.tabs button{background:var(--card);color:var(--tx);border:2px solid var(--bd);white-space:nowrap;flex:1;padding:10px 14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.mut{color:var(--mut);font-size:15px}
.msg{background:#27ae60;color:#fff;border-radius:14px;padding:12px 16px;text-align:center;font-weight:700;margin-bottom:12px}
.zc{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .04em}.zp{display:inline-flex;flex-direction:row;align-items:center;font-size:.44em;line-height:1;margin-left:.12em;font-weight:600;opacity:.9}.zp.n{flex-direction:column}.zp i{font-style:normal}.zs{writing-mode:vertical-rl;text-orientation:upright}#app.zy{line-height:1.85}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b2d;--card:#182840;--tx:#e6f0ff;--mut:#8fa8c7;--bd:#2a4266}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* 雲端設定：第一次開啟時在畫面上填寫，之後會記在網址的 #cfg=... 裡。
   把「家長 → 其他設定」裡的同步連結開在其他裝置，就會自動帶入設定。 */
var DB_URL = '', ROOT = '';
(function () {
  try {
    var m = /[#&]cfg=([^&]+)/.exec(location.hash), c = null;
    if (m) { c = JSON.parse(atob(decodeURIComponent(m[1]))); localStorage.setItem('star_cfg', JSON.stringify(c)); }
    else c = JSON.parse(localStorage.getItem('star_cfg') || 'null');
    if (c && c.u && c.r) { DB_URL = c.u; ROOT = c.r; }
  } catch (e) {}
})();
var CONFIGURED = !!DB_URL;
function rndRoom() { var a = new Uint8Array(8); try { crypto.getRandomValues(a); } catch (e) { for (var i = 0; i < 8; i++) a[i] = Math.random() * 256; } return 'star-' + Array.prototype.map.call(a, function (x) { return (x % 36).toString(36); }).join(''); }
function shareLink() { return location.origin + location.pathname + '#cfg=' + encodeURIComponent(btoa(JSON.stringify({ u: DB_URL, r: ROOT }))); }
var K = 'star_reward_fb_v1';
function dbUrl(p) { return DB_URL.replace(/\/$/, '') + '/' + ROOT + (p || '') + '.json'; }

function def() {
  return { ts: 0, name: '小寶貝', pin: '1234', points: 0, zy: true,
    tasks: [{id:1,ic:'🧹',n:'整理房間',p:5},{id:2,ic:'🪥',n:'自己刷牙',p:2},{id:3,ic:'📚',n:'完成功課',p:5},{id:4,ic:'🧺',n:'幫忙家事',p:3}],
    rewards: [{id:11,ic:'📺',n:'看30分鐘動畫',p:10},{id:12,ic:'🍪',n:'小點心',p:15},{id:13,ic:'🎡',n:'選週末活動',p:30},{id:14,ic:'🧸',n:'新玩具',p:60}],
    log: [] };
}
function norm(d) { d.tasks = d.tasks || []; d.rewards = d.rewards || []; d.log = d.log || []; d.ts = d.ts || 0; d.points = d.points || 0; return d; }

var S;
try { S = JSON.parse(localStorage.getItem(K)); } catch (e) {}
S = norm(S && S.tasks ? S : def());

var mode = 'kid', tab = 'award', msg = '', pend = null, askPin = false;
var syncState = CONFIGURED ? 'busy' : 'off', dirty = false, pushing = false, needRender = false;

/* ---------- 聲音 ---------- */
var actx = null;
function playCoin() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.connect(g); g.connect(actx.destination);
    o.frequency.setValueAtTime(988, t); o.frequency.setValueAtTime(1319, t + .08);
    g.gain.setValueAtTime(.2, t); g.gain.exponentialRampToValueAtTime(.001, t + .35);
    o.start(t); o.stop(t + .35);
  } catch (e) {}
}

/* ---------- 雲端同步（Firebase Realtime Database REST，不需登入） ---------- */
var CHIP = { off: '📴 未設定雲端（只存在此裝置）', ok: '🟢 已同步', busy: '🔄 同步中…', err: '🔴 連線失敗，會自動重試' };
function setSync(s) {
  syncState = s;
  var c = document.getElementById('chip');
  if (c) { c.textContent = CHIP[s]; c.className = 'sync-chip ' + s; }
}
function localSave() { try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {} }
function save() { S.ts = Date.now(); localSave(); dirty = true; push(); }

function push() {
  if (!CONFIGURED || pushing) return;
  pushing = true; setSync('busy');
  var sent = S.ts;
  fetch(dbUrl(), { method: 'PUT', body: JSON.stringify(S) })
    .then(function (r) { if (!r.ok) throw new Error(r.status); pushing = false; if (S.ts === sent) { dirty = false; setSync('ok'); } else push(); })
    .catch(function () { pushing = false; setSync('err'); });
}

function pull() {
  if (!CONFIGURED) return;
  if (dirty || pushing) { if (dirty && !pushing) push(); return; }
  fetch(dbUrl('/ts'))
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (ts) {
      if (ts === null) { S.ts = S.ts || Date.now(); dirty = true; push(); return; }
      if (ts > S.ts) {
        return fetch(dbUrl()).then(function (r) { return r.json(); }).then(function (d) {
          if (!d || !d.tasks) return;
          var old = S.points;
          S = norm(d); localSave();
          if (S.points > old) playCoin();
          var a = document.activeElement;
          if ((a && a.tagName === 'INPUT') || askPin) needRender = true; else render();
          setSync('ok');
        });
      }
      setSync('ok');
    })
    .catch(function () { setSync('err'); });
}
document.addEventListener('focusout', function () { if (needRender) setTimeout(function () { var a = document.activeElement; if (!(a && a.tagName === 'INPUT')) { needRender = false; render(); } }, 100); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) pull(); });
setInterval(pull, 5000);
pull();

/* ---------- 注音（直式） ---------- */
var ZI={b:'ㄅ',p:'ㄆ',m:'ㄇ',f:'ㄈ',d:'ㄉ',t:'ㄊ',n:'ㄋ',l:'ㄌ',g:'ㄍ',k:'ㄎ',h:'ㄏ',j:'ㄐ',q:'ㄑ',x:'ㄒ',zh:'ㄓ',ch:'ㄔ',sh:'ㄕ',r:'ㄖ',z:'ㄗ',c:'ㄘ',s:'ㄙ'};
var FM={a:'ㄚ',o:'ㄛ',e:'ㄜ',ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ',er:'ㄦ',i:'ㄧ',ia:'ㄧㄚ',io:'ㄧㄛ',ie:'ㄧㄝ',iao:'ㄧㄠ',iu:'ㄧㄡ',iou:'ㄧㄡ',ian:'ㄧㄢ',in:'ㄧㄣ',iang:'ㄧㄤ',ing:'ㄧㄥ',iong:'ㄩㄥ',u:'ㄨ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',ui:'ㄨㄟ',uei:'ㄨㄟ',uan:'ㄨㄢ',un:'ㄨㄣ',uen:'ㄨㄣ',uang:'ㄨㄤ',ueng:'ㄨㄥ',ong:'ㄨㄥ',v:'ㄩ',ve:'ㄩㄝ',van:'ㄩㄢ',vn:'ㄩㄣ'};
var TM={'1':'','2':'ˊ','3':'ˇ','4':'ˋ'};
function z1(p){var m=/^([a-zü]+)([1-5])?$/.exec(p||'');if(!m)return '';var s=m[1].replace('ü','v'),t=m[2]||'5',i='',f,r;if(s==='er')f='er';else if(s[0]==='y'){r=s.slice(1);f=r[0]==='i'?r:r[0]==='u'?'v'+r.slice(1):'i'+r}else if(s[0]==='w'){r=s.slice(1);f=r[0]==='u'?r:'u'+r}else{var l=s.slice(0,2);if(l==='zh'||l==='ch'||l==='sh')i=l;else if(ZI[s[0]])i=s[0];f=s.slice(i.length);if(i&&'jqx'.indexOf(i)>=0&&f[0]==='u')f='v'+f.slice(1);if(f==='i'&&['zh','ch','sh','r','z','c','s'].indexOf(i)>=0)f=''}var b=(ZI[i]||'')+(f===''?'':(FM[f]||''));if(!b)return '';return t==='5'?'˙'+b:b+TM[t]}
function zc(c,r){var n=r[0]==='˙',t='';if(n)r=r.slice(1);else if('ˊˇˋ'.indexOf(r.slice(-1))>=0){t=r.slice(-1);r=r.slice(0,-1)}return '<span class="zc"><span>'+c+'</span><span class="zp'+(n?' n':'')+'">'+(n?'<i>˙</i>':'')+'<span class="zs">'+r+'</span>'+(t?'<i>'+t+'</i>':'')+'</span></span>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function Z(s){s=String(s);if(mode!=='kid'||S.zy===false||!window.pinyinPro)return esc(s);return s.split(/([\u4e00-\u9fff]+)/).map(function(seg,i){if(i%2===0)return esc(seg);var a;try{a=pinyinPro.pinyin(seg,{toneType:'num',type:'array',v:true})}catch(e){return esc(seg)}return seg.split('').map(function(c,j){var r=z1(a[j]);return r?zc(c,r):c}).join('')}).join('')}
function lg(t){S.log.unshift({t:t,d:new Date().toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})});S.log=S.log.slice(0,50)}

/* ---------- 畫面 ---------- */
function render() {
  var h = '<div class="top-bar"><div class="brand">⭐ ' + Z('小星星獎勵樂園') + '</div><div>';
  h += mode === 'kid' ? '<button class="l" data-a="parent">🔒 ' + Z('家長') + '</button>' : '<button class="l" data-a="exit">👧 回小朋友模式</button>';
  h += '</div></div>';
  if (askPin) h += '<div class="card">' + Z('請輸入家長密碼：') + '<div class="row"><input id="pin" type="password" inputmode="numeric" size="8"><button data-a="pinok">' + Z('確定') + '</button><button class="l" data-a="cancel">' + Z('取消') + '</button></div></div>';
  if (!CONFIGURED) h += '<div class="card"><b>☁️ 設定雲端同步（家長只需做一次）</b><div class="mut" style="margin:6px 0">貼上 Firebase Realtime Database 的網址，再取一個房間名稱。</div><div class="row"><input id="cfgu" placeholder="https://xxxx-default-rtdb.…firebasedatabase.app" style="width:100%"></div><div class="row"><input id="cfgr" value="' + rndRoom() + '"></div><button data-a="cfgsave">儲存並開始</button> <span class="mut">不設定也能用，但資料只存在這台裝置。</span></div>';
  if (msg) h += '<div class="msg">' + Z(msg) + '</div>';
  h += '<div class="hero"><div>' + Z(S.name + ' 的星星') + '</div><div class="hero-num">⭐ ' + S.points + '</div>' +
       (mode === 'parent' ? '<span class="sync-chip ' + syncState + '" id="chip" data-a="refresh">' + CHIP[syncState] + '</span>' : '') + '</div>';
  h += mode === 'kid' ? kidView() : parentView();
  var A = document.getElementById('app');
  A.classList.toggle('zy', mode === 'kid' && S.zy !== false);
  A.innerHTML = h;
  msg = '';
}

function kidView() {
  var h = '<h3>🎁 ' + Z('想要的獎勵') + '</h3><div class="grid">';
  S.rewards.forEach(function (r) {
    var pc = Math.min(100, Math.round(S.points / (r.p || 1) * 100)), ok = S.points >= r.p;
    h += '<div class="item-card"><div class="ic">' + esc(r.ic) + '</div><b>' + Z(r.n) + '</b><div class="mut">' + Z('需要') + ' ⭐ ' + r.p + '</div><div class="bar"><i style="width:' + pc + '%"></i></div>';
    h += ok ? '<button class="g" data-a="redeem" data-id="' + r.id + '">' + Z(pend === r.id ? '再按一次確定！' : '兌換') + '</button>' : '<span class="mut">' + Z('還差 ') + (r.p - S.points) + Z(' 顆星星') + '</span>';
    h += '</div>';
  });
  h += '</div><h3 style="margin-top:24px">💪 ' + Z('怎麼賺星星') + '</h3><div class="grid">';
  S.tasks.forEach(function (t) {
    h += '<div class="item-card"><div class="ic">' + esc(t.ic) + '</div><b>' + Z(t.n) + '</b><div class="mut">+' + t.p + Z(' 顆星星') + '</div></div>';
  });
  return h + '</div>' + logView(6);
}

function parentView() {
  var T = [['award','➕ 加點數'],['t','📝 任務設定'],['r','🎁 獎勵設定'],['set','⚙️ 其他設定']];
  var h = '<div class="tabs">';
  T.forEach(function (x) { h += '<button class="' + (tab === x[0] ? 'on' : '') + '" data-a="tab" data-id="' + x[0] + '">' + x[1] + '</button>'; });
  h += '</div>';
  if (tab === 'award') {
    h += '<div class="grid">';
    S.tasks.forEach(function (t) { h += '<div class="item-card"><div class="ic">' + esc(t.ic) + '</div><b>' + esc(t.n) + '</b><button data-a="award" data-id="' + t.id + '">完成 +' + t.p + ' 顆</button></div>'; });
    h += '</div><div class="card"><b>手動調整星星數</b><div class="row"><button class="r" data-a="adj" data-id="-1">-1</button><button class="g" data-a="adj" data-id="1">+1</button><button class="g" data-a="adj" data-id="5">+5</button></div></div>' + logView(10);
  } else if (tab === 't' || tab === 'r') {
    var k = tab, list = k === 't' ? S.tasks : S.rewards;
    h += '<div class="card">';
    list.forEach(function (x) {
      h += '<div class="row"><input size="2" value="' + esc(x.ic) + '" data-f="' + k + '|' + x.id + '|ic"><input size="12" value="' + esc(x.n) + '" data-f="' + k + '|' + x.id + '|n"><input type="number" style="width:80px" value="' + x.p + '" data-f="' + k + '|' + x.id + '|p"> ⭐<button class="r" data-a="del" data-k="' + k + '" data-id="' + x.id + '">刪除</button></div>';
    });
    h += '<div style="margin-top:14px"><button class="g" data-a="add" data-k="' + k + '">＋ 新增' + (k === 't' ? '任務' : '獎勵') + '</button></div></div>';
  } else {
    h += '<div class="card"><div class="row">小朋友稱呼：<input value="' + esc(S.name) + '" data-f="set|0|name"></div><div class="row">家長密碼：<input value="' + esc(S.pin) + '" data-f="set|0|pin"></div><div class="row">目前星星數：<input type="number" style="width:90px" value="' + S.points + '" data-f="set|0|points"></div><div class="row"><label><input type="checkbox" data-f="set|0|zy" ' + (S.zy !== false ? 'checked' : '') + '> 小朋友模式顯示直式注音</label></div><div style="margin-top:14px"><button class="r" data-a="clr">清空歷程紀錄</button></div></div>' + shareCard();
  }
  return h;
}

function shareCard() {
  if (!CONFIGURED) return '';
  return '<div class="card"><b>🔗 同步連結</b><div class="mut" style="margin:6px 0">在其他裝置開啟這個網址（或加入主畫面），看到的內容就會一樣。</div><div class="row"><input readonly style="width:100%" value="' + esc(shareLink()) + '" onclick="this.select()"></div><button class="l" data-a="cfgreset">重設雲端設定</button></div>';
}
function logView(n) {
  var h = '<h3 style="margin-top:24px">📒 ' + Z('歷程紀錄') + '</h3><div class="card">';
  if (!S.log.length) h += '<span class="mut">' + Z('目前還沒有紀錄') + '</span>';
  S.log.slice(0, n).forEach(function (l) { h += '<div class="row"><span class="mut">' + esc(l.d) + '</span> ' + Z(l.t) + '</div>'; });
  return h + '</div>';
}

/* ---------- 事件 ---------- */
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-a]');
  if (!b) return;
  var a = b.dataset.a, id = +b.dataset.id, k = b.dataset.k, list;
  if (a === 'parent') askPin = true;
  else if (a === 'cancel') askPin = false;
  else if (a === 'pinok') { if (document.getElementById('pin').value === S.pin) { mode = 'parent'; askPin = false; } else msg = '密碼不正確喔！'; }
  else if (a === 'exit') { mode = 'kid'; tab = 'award'; }
  else if (a === 'tab') tab = b.dataset.id;
  else if (a === 'refresh') { pull(); return; }
  else if (a === 'cfgsave') {
    var u = document.getElementById('cfgu').value.trim().replace(/\/+$/, ''), rr = document.getElementById('cfgr').value.replace(/[^A-Za-z0-9_-]/g, '');
    if (/^https:\/\/[^\s]+$/.test(u) && rr.length >= 6) { var c = { u: u, r: rr }; localStorage.setItem('star_cfg', JSON.stringify(c)); location.hash = 'cfg=' + encodeURIComponent(btoa(JSON.stringify(c))); location.reload(); return; }
    msg = '請填寫正確的網址，房間名稱至少 6 個英數字';
  }
  else if (a === 'cfgreset') { if (confirm('確定要重設雲端設定嗎？')) { localStorage.removeItem('star_cfg'); location.hash = ''; location.reload(); return; } }
  else if (a === 'award') {
    var t = S.tasks.filter(function (x) { return x.id === id; })[0];
    S.points += t.p; lg(t.n + ' +' + t.p); msg = '🎉 ' + t.n + '，獲得 +' + t.p + ' 顆星星！'; playCoin(); save();
  }
  else if (a === 'adj') { var v = +b.dataset.id; S.points = Math.max(0, S.points + v); lg('手動調整星星 ' + (v > 0 ? '+' : '') + v); playCoin(); save(); }
  else if (a === 'redeem') {
    var r = S.rewards.filter(function (x) { return x.id === id; })[0];
    if (pend === id && S.points >= r.p) { S.points -= r.p; lg('兌換「' + r.n + '」 -' + r.p); msg = '🎁 兌換成功：' + r.n; playCoin(); pend = null; save(); }
    else pend = id;
  }
  else if (a === 'add') { list = k === 't' ? S.tasks : S.rewards; list.push({ id: Date.now(), ic: k === 't' ? '⭐' : '🎁', n: '新項目', p: 5 }); save(); }
  else if (a === 'del') { list = k === 't' ? S.tasks : S.rewards; var i = list.findIndex(function (x) { return x.id === id; }); if (i > -1) list.splice(i, 1); save(); }
  else if (a === 'clr') { if (confirm('確定要清空所有紀錄嗎？')) { S.log = []; save(); } }
  render();
});

document.addEventListener('change', function (e) {
  var f = e.target.dataset.f;
  if (!f) return;
  var p = f.split('|'), v = e.target.value;
  if (p[0] === 'set') S[p[2]] = p[2] === 'points' ? Math.max(0, parseInt(v) || 0) : p[2] === 'zy' ? e.target.checked : v;
  else {
    var list = p[0] === 't' ? S.tasks : S.rewards;
    var it = list.filter(function (i) { return i.id == p[1]; })[0];
    if (it) it[p[2]] = p[2] === 'p' ? Math.max(0, parseInt(v) || 0) : v;
  }
  save();
});

render();
</script>
